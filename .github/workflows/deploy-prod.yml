name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

# 進行中の prod ロールアウトを中断させない
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_REGION: asia-northeast1
  TEST_USER_EMAIL: test@pokelingual.dev
  SIGNUP_TEST_EMAIL_DOMAIN: pokelingual.dev

jobs:
  tag-version:
    name: Tag Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list "v*" --sort=-v:refname | head -n1)
          if [ -z "${latest}" ]; then
            echo "no v* tag found" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${BUMP}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "unknown bump: ${BUMP}" >&2; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${next}"

      - name: Tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  deploy-backend:
    name: Deploy Backend to Cloud Run
    needs: tag-version
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: pokelingual-api-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GOOGLE_CLOUD_REGION }}-docker.pkg.dev

      # タグは検証済みの main コミットに打たれる。dev とは別プロジェクト・別レジストリのため、
      # 同一コミットを prod レジストリへ再ビルドする (テストは dev マージ時に済んでいるので走らせない)。
      - name: Build and push Docker image
        run: |
          IMAGE_BASE="${{ env.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT_ID }}/pokelingual-backend/api"
          docker build \
            -f backend/Dockerfile \
            -t "${IMAGE_BASE}:${{ github.sha }}" \
            -t "${IMAGE_BASE}:${{ needs.tag-version.outputs.version }}" \
            .
          docker push "${IMAGE_BASE}" --all-tags

      - name: Deploy to Cloud Run
        run: |
          INFRA_VARS=$(grep -vE '^(#|$)' backend/.env.infra | paste -sd, -)
          ENV_VARS=$(grep -vE '^(#|$)' backend/.env.prod | paste -sd, -)
          TUNING_VARS=$(grep -vE '^(#|$)' backend/.env.tuning | paste -sd, -)
          ENV_KV=(
            "APP_MODE=real"
            "FRONTEND_URL=${{ vars.FRONTEND_URL }}"
            "GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT_ID }}"
            "POKEMON_SNAPSHOT_URI=${{ vars.POKEMON_SNAPSHOT_URI }}"
          )
          UPDATE_ENV_VARS=$(IFS=,; echo "${ENV_KV[*]},${INFRA_VARS},${ENV_VARS},${TUNING_VARS}")
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT_ID }}/pokelingual-backend/api:${{ github.sha }}" \
            --region ${{ env.GOOGLE_CLOUD_REGION }} \
            --project ${{ vars.GOOGLE_CLOUD_PROJECT_ID }} \
            --remove-secrets "GEMINI_API_KEY,UPSTASH_REDIS_ENDPOINT,UPSTASH_REDIS_PASSWORD" \
            --update-secrets "UPSTASH_REDIS_URL=pokelingual-upstash-redis-url:latest" \
            --update-env-vars "${UPDATE_ENV_VARS}"

  # prod のレート制限枠は実ユーザーと共有するため、Gemini 経路までは広げず health + 認証付き
  # read のみに留める。
  smoke-prod:
    name: Smoke Test (prod)
    needs: deploy-backend
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: pokelingual-api-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get Cloud Run service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GOOGLE_CLOUD_REGION }} \
            --project ${{ vars.GOOGLE_CLOUD_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Run smoke test
        env:
          SERVICE_URL: ${{ steps.service-url.outputs.url }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: bash scripts/smoke-dev.sh

      # 実 signUp〜メール確認〜ログインの配線は上の固定フィクスチャユーザでの検証では
      # 通らないため、使い捨てユーザーで別途検証する。
      - name: Run signup smoke test
        env:
          SERVICE_URL: ${{ steps.service-url.outputs.url }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
        run: bash scripts/smoke-prod-signup.sh

  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: [tag-version, deploy-backend]
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite は環境値をビルド時に埋め込むため、prod では prod URL とタグ版で再ビルドする。
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_BUILD_VERSION: ${{ needs.tag-version.outputs.version }}
          VITE_ENVIRONMENT: prod
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID }}
