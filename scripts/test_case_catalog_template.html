<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>__CSS__</style>
<style>
  /* レイアウト: 左に区分と大機能の目次、右に大機能 > 小機能の順で縦に読む。小機能ごとに Given・When・Then・タグの表を置く。 */
  :root {
    color-scheme: dark;
    --bg: #1c1c1c; --surface: #242424; --sunken: #2d2d2d;
    --fg: #f2f2f2; --muted: #d0d0d0; --faint: #aaaaaa; --line: #4c4c4c; --line-strong: #8c8c8c;
    --accent: #ffe14d; --accent-soft: #3d3600;
    --ok: #8ef0a0; --err: #ff9b9b; --on-fill: #111111;
    --k0: #b8bcc6; --k1: #6fe3ff; --k2: #c9a6ff; --k3: #7ef0d0; --k4: #ff9bd0; --k5: #ffd27a;
    --t0: #ffe14d; --t1: #ff9ec4; --t2: #ffb35c; --t3: #8ef0a0; --t4: #8fd8ff; --t5: #d2b3ff;
  }
  body { background: var(--bg); color: var(--fg); }
  .tabular { font-variant-numeric: tabular-nums; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .chev { transition: transform .12s ease; }
  button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } html { scroll-behavior: auto; } }
  html { scroll-behavior: smooth; }

  /* 種別と観点は色枠と同じ色の文字、正常系と異常系は塗りつぶし。--c に色を渡す。 */
  .chip { display: inline-flex; align-items: center; padding: .125rem .5rem; font-size: .6875rem; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .chip-outline { color: var(--c); border: 1.5px solid var(--c); }
  .chip-ok { background: var(--ok); color: var(--bg); }
  .chip-err { background: var(--err); color: var(--bg); }
  .filter-btn { --c: var(--muted); display: inline-flex; align-items: center; gap: .375rem; padding: .25rem .625rem; font-size: .75rem; font-weight: 700; color: var(--c); border: 1.5px solid var(--c); background: transparent; cursor: pointer; }
  .filter-btn:hover { background: var(--sunken); }
  .filter-btn[aria-pressed="true"] { background: var(--c); color: var(--on-fill); }
  .filter-btn .count { font-variant-numeric: tabular-nums; opacity: .75; }

  .legend { margin-top: .75rem; border: 1px solid var(--line-strong); background: var(--surface); }
  .legend > summary { padding: .5rem .75rem; font-size: .8125rem; font-weight: 700; }
  .legend-body { border-top: 1px solid var(--line-strong); padding: .25rem .75rem; }
  .legend-item { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: .25rem .75rem; padding: .5rem 0; border-top: 1px solid var(--line); font-size: .8125rem; line-height: 1.6; }
  .legend-item:first-child { border-top: 0; }
  .legend-count { margin-top: .25rem; font-size: .6875rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  @media (max-width: 40rem) { .legend-item { grid-template-columns: minmax(0, 1fr); } }
</style>

</head>
<body>
<div class="mx-auto w-full max-w-[90rem] px-4 sm:px-6 py-6 font-sans text-fg">
  <header class="flex flex-col gap-2 pb-5">
    <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1">
      <h1 id="title" class="text-2xl font-bold tracking-tight"></h1>
      <p id="summary" class="text-sm text-muted tabular"></p>
    </div>
    <p id="disclaimer" class="max-w-3xl text-sm text-muted leading-relaxed"></p>
    <details class="legend"><summary>観点の一覧と付ける条件</summary><div class="legend-body" id="legend-body"></div></details>
    <p id="commit" class="text-xs text-faint" hidden>生成元 commit: <code id="commit-sha"></code></p>
  </header>

  <div class="grid gap-6 lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-8">
    <aside class="lg:sticky lg:self-start lg:max-h-[calc(100vh-2rem)] lg:overflow-y-auto" style="top: calc(env(safe-area-inset-top, 0px) + 1rem)">
      <nav id="toc" aria-label="大機能の目次" class="flex flex-col gap-4 text-sm"></nav>
    </aside>

    <main class="min-w-0">
      <section aria-label="絞り込み" class="sticky z-20 -mx-1 mb-4 border border-line bg-surface px-3 py-3 shadow-sm" style="top: env(safe-area-inset-top, 0px)">
        <div class="flex flex-col gap-3">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <span class="w-[4.5rem] text-xs font-medium text-muted">正常異常</span>
            <div id="na-filter" class="inline-flex overflow-hidden border border-line text-sm" role="group" aria-label="正常異常"></div>
            <div class="ml-auto flex gap-1.5">
              <button id="expand" type="button" class="border border-line px-2.5 py-1.5 text-xs text-muted hover:bg-sunken">すべて開く</button>
              <button id="collapse" type="button" class="border border-line px-2.5 py-1.5 text-xs text-muted hover:bg-sunken">すべて閉じる</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <span class="w-[4.5rem] text-xs font-medium text-muted">種別</span>
            <div id="kind-filter" class="flex flex-wrap gap-1.5"></div>
          </div>
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <span class="w-[4.5rem] text-xs font-medium text-muted">観点</span>
            <div id="perspective-filter" class="flex flex-wrap items-center gap-1.5"></div>
          </div>
        </div>
      </section>
      <div id="content" class="flex flex-col gap-10"></div>
    </main>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CASES = DATA.cases;
  var KINDS = ['単体テスト', '部品間結合テスト', 'インフラ結合テスト', 'サービス間結合テスト', 'E2Eテスト', 'シナリオテスト'];
  var REGIONS = DATA.regions;
  var PERSPECTIVES = DATA.perspectives;
  var NO_PERSPECTIVE = 'タグなし';
  var state = { kinds: new Set(), na: '', perspectives: new Set(), openAll: null };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function kindIndex(k) { var i = KINDS.indexOf(k); return i < 0 ? 0 : i; }
  function slug(s) { return 'sec-' + Array.from(s).map(function (c) { return c.charCodeAt(0).toString(36); }).join('').slice(0, 40); }

  function perspectiveIndex(name) { for (var i = 0; i < PERSPECTIVES.length; i++) if (PERSPECTIVES[i].name === name) return i; return 0; }

  function visible(c) {
    if (state.kinds.size && !state.kinds.has(c.t)) return false;
    if (state.na && c.n !== state.na) return false;
    if (state.perspectives.size) {
      var isMatched = false;
      state.perspectives.forEach(function (p) { if (p === NO_PERSPECTIVE ? c.g.length === 0 : c.g.indexOf(p) >= 0) isMatched = true; });
      if (!isMatched) return false;
    }
    return true;
  }

  function groupBy(list, key) {
    var map = new Map();
    list.forEach(function (c) { var k = key(c); if (!map.has(k)) map.set(k, []); map.get(k).push(c); });
    return map;
  }

  function tagsHtml(c) {
    var na = c.n === '異常系' ? '<span class="chip chip-err">異常系</span>' : c.n === '正常系' ? '<span class="chip chip-ok">正常系</span>' : '';
    var kind = c.t ? '<span class="chip chip-outline" style="--c:var(--k' + kindIndex(c.t) + ')">' + esc(c.t) + '</span>' : '';
    var environments = (c.e || []).map(function (e) { return '<span class="inline-flex items-center border border-line bg-surface px-2 py-0.5 text-[0.6875rem] font-medium text-muted whitespace-nowrap">' + esc(e) + '</span>'; }).join('');
    var skip = c.x ? '<span class="inline-flex items-center border border-dashed border-strong px-2 py-0.5 text-[0.6875rem] font-medium text-muted whitespace-nowrap">skip 中</span>' : '';
    return na + kind + environments + skip + c.g.map(perspectiveChipHtml).join('');
  }

  function perspectiveChipHtml(name) {
    return '<span class="chip chip-outline" style="--c:var(--t' + perspectiveIndex(name) + ')">' + esc(name) + '</span>';
  }

  function cellText(text) {
    if (!text) return '<span class="text-faint">—</span>';
    return esc(text);
  }

  function gOf(c) { return c.steps[0].G; }
  function wOf(c) { return c.steps[0].W.join('\u0001'); }

  function canShareWhenCell(a, b) { return !isBlockCase(a) && !isBlockCase(b) && wOf(a) === wOf(b); }

  function countMerges(rows) {
    var n = 0;
    rows.forEach(function (c, i) {
      var prev = rows[i - 1];
      if (!prev) return;
      if (gOf(prev) === gOf(c)) n++;
      if (canShareWhenCell(prev, c)) n++;
    });
    return n;
  }

  function sortByKeys(list, primary, secondary) {
    var primaryOrder = new Map(), secondaryOrder = new Map();
    list.forEach(function (c) {
      if (!primaryOrder.has(primary(c))) primaryOrder.set(primary(c), primaryOrder.size);
      var pair = primary(c) + '\u0000' + secondary(c);
      if (!secondaryOrder.has(pair)) secondaryOrder.set(pair, secondaryOrder.size);
    });
    return list.slice().sort(function (a, b) {
      return primaryOrder.get(primary(a)) - primaryOrder.get(primary(b)) ||
        secondaryOrder.get(primary(a) + '\u0000' + secondary(a)) - secondaryOrder.get(primary(b) + '\u0000' + secondary(b));
    });
  }

  function orderByShared(list) {
    var givenFirst = sortByKeys(list, gOf, wOf);
    var whenFirst = sortByKeys(list, wOf, gOf);
    return countMerges(whenFirst) > countMerges(givenFirst) ? whenFirst : givenFirst;
  }

  function runLength(rows, start, same) {
    var n = 1;
    while (start + n < rows.length && same(rows[start], rows[start + n])) n++;
    return n;
  }

  function whenHtml(operations, isInsideNumberedStep) {
    if (!operations.length) return cellText('');
    if (operations.length === 1) return esc(operations[0]);
    var markerSize = isInsideNumberedStep ? 'marker:text-xs marker:font-normal marker:text-faint' : 'marker:text-base marker:font-bold marker:text-accent';
    return '<ol class="list-decimal space-y-1 pl-6 ' + markerSize + '">' + operations.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>';
  }

  function rowsOfStep(st) { return st.E ? st.E.length : 1; }

  function isBlockCase(c) { return c.steps.length > 1 || c.steps.some(function (st) { return st.E; }); }

  function rowsOf(c) { return c.steps.reduce(function (n, st) { return n + rowsOfStep(st); }, 0); }

  function givenSpan(rows, start) {
    var n = 0, i = start;
    while (i < rows.length && gOf(rows[i]) === gOf(rows[start])) { n += rowsOf(rows[i]); i++; }
    return n;
  }

  function environmentThenHtml(environment, text) {
    return '<span class="mr-2 inline-flex items-center border border-line bg-surface px-1.5 py-0.5 align-middle text-[0.6875rem] font-medium text-muted whitespace-nowrap">' + esc(environment) + '</span>' + cellText(text);
  }

  function stepRowsHtml(c, newG, span, cell) {
    var total = rowsOf(c), numbered = c.steps.length > 1, html = '';
    c.steps.forEach(function (st, i) {
      var rows = rowsOfStep(st);
      var whenCell = numbered
        ? '<div class="flex items-start gap-2.5"><span class="mt-px inline-flex h-6 min-w-6 flex-none items-center justify-center bg-accent-soft px-1.5 text-base font-bold text-accent">' + (i + 1) + '</span><div class="min-w-0 flex-1">' + whenHtml(st.W, true) + '</div></div>'
        : whenHtml(st.W, false);
      for (var r = 0; r < rows; r++) {
        var isFirstRow = i === 0 && r === 0;
        var border = r > 0 ? 'border-t border-dashed' : isFirstRow ? (newG ? 'border-t-2' : 'border-t') : 'border-t border-dashed';
        html += '<tr class="' + border + ' border-strong">';
        if (isFirstRow && newG) html += '<td rowspan="' + span + '" class="' + cell.replace('border-l border-strong', '') + ' font-medium">' + cellText(st.G) + '</td>';
        if (r === 0) html += '<td' + (rows > 1 ? ' rowspan="' + rows + '"' : '') + ' class="' + cell + '">' + whenCell + '</td>';
        html += '<td class="' + cell + ' font-medium">' + (st.E ? environmentThenHtml(st.E[r][0], st.E[r][1]) : cellText(st.T)) + '</td>';
        if (isFirstRow) html += '<td rowspan="' + total + '" class="' + cell + '"><div class="flex flex-wrap gap-1.5">' + tagsHtml(c) + '</div></td>';
        html += '</tr>';
      }
    });
    return html;
  }

  function smallBodyHtml(rawList) {
    var rows = orderByShared(rawList);
    var th = 'px-3 py-2 text-left text-xs font-bold tracking-wider text-faint';
    var html = '<div class="overflow-x-auto"><table class="w-full min-w-[44rem] border-collapse text-[0.9375rem] leading-relaxed">' +
      '<thead><tr class="border-b-2 border-strong"><th class="' + th + ' w-[27%]">Given</th><th class="' + th + ' w-[27%]">When</th><th class="' + th + '">Then</th><th class="' + th + ' w-[9.5rem]">タグ</th></tr></thead><tbody>';
    rows.forEach(function (c, i) {
      var prev = rows[i - 1];
      var cell = 'px-3 py-2.5 align-top border-l border-strong';
      var newG = !prev || gOf(prev) !== gOf(c);
      if (isBlockCase(c)) { html += stepRowsHtml(c, newG, newG ? givenSpan(rows, i) : 0, cell); return; }
      var newW = !prev || !canShareWhenCell(prev, c);
      var st = c.steps[0];
      html += '<tr class="' + (newG ? 'border-t-2' : 'border-t') + ' border-strong">';
      if (newG) {
        html += '<td rowspan="' + givenSpan(rows, i) + '" class="' + cell.replace('border-l border-strong', '') + ' font-medium">' + cellText(st.G) + '</td>';
      }
      if (newW) {
        html += '<td rowspan="' + runLength(rows, i, canShareWhenCell) + '" class="' + cell + '">' + whenHtml(st.W, false) + '</td>';
      }
      html += '<td class="' + cell + ' font-medium">' + cellText(st.T) + (c.x ? '<span class="ml-2 text-xs font-normal text-faint">skip 中のため未検証</span>' : '') + '</td>' +
        '<td class="' + cell + '"><div class="flex flex-wrap gap-1.5">' + tagsHtml(c) + '</div></td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  function render() {
    var list = CASES.filter(visible);
    var total = CASES.length;
    document.getElementById('summary').textContent = total + ' ケース';
    document.getElementById('title').textContent = DATA.title;
    document.getElementById('disclaimer').textContent = DATA.disclaimer;
    if (DATA.commit) { document.getElementById('commit').hidden = false; document.getElementById('commit-sha').textContent = DATA.commit; }

    var byRegion = groupBy(list, function (c) { return c.k; });
    var toc = '', content = '';
    REGIONS.forEach(function (region) {
      var inRegion = byRegion.get(region);
      if (!inRegion) return;
      var majors = groupBy(inRegion, function (c) { return c.d; });
      toc += '<div><p class="mb-1 px-2 text-[0.6875rem] font-bold tracking-widest text-faint">' + esc(region) + '</p><ul class="flex flex-col">';
      majors.forEach(function (mcases, major) {
        var id = slug(region + major);
        toc += '<li><a href="#' + id + '" class="flex items-center justify-between gap-2 px-2 py-1 text-muted hover:bg-sunken hover:text-fg"><span class="min-w-0">' + esc(major) + '</span><span class="tabular text-xs text-faint">' + mcases.length + '</span></a></li>';
        var minors = Array.from(groupBy(mcases, function (c) { return c.m || ''; }).entries());
        var sec = '<section id="' + id + '" class="scroll-mt-40"><div class="mb-3 flex items-baseline gap-3 border-b border-line pb-2">' +
          '<span class="text-xs font-medium text-faint">' + esc(region) + '</span><h2 class="text-xl font-bold">' + esc(major) + '</h2>' +
          '<div class="ml-auto flex gap-1.5 self-center"><button type="button" data-section-action="expand" class="border border-line px-2.5 py-1.5 text-xs text-muted hover:bg-sunken">すべて開く</button>' +
          '<button type="button" data-section-action="collapse" class="border border-line px-2.5 py-1.5 text-xs text-muted hover:bg-sunken">すべて閉じる</button></div></div><div class="flex flex-col gap-6">';
        minors.forEach(function (entry) {
          var minor = entry[0], ml = entry[1];
          var smalls = groupBy(ml, function (c) { return c.s; });
          sec += '<div class="flex flex-col gap-2">';
          smalls.forEach(function (sl, small) {
            var open = state.openAll === null ? true : state.openAll;
            sec += '<details ' + (open ? 'open' : '') + ' class="overflow-hidden border border-strong bg-surface"><summary class="flex items-center gap-2 px-3 py-2.5">' +
              '<svg class="chev h-3.5 w-3.5 flex-none text-faint" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>' +
              '<span class="min-w-0 flex-1 font-medium leading-snug">' + esc(small) + (region === 'シナリオ' ? '<span class="font-normal text-muted">（' + esc(minor) + '）</span>' : '') + '</span></summary>' +
              '<div class="border-t border-strong">' + smallBodyHtml(sl) + '</div></details>';
          });
          sec += '</div>';
        });
        sec += '</div></section>';
        content += sec;
      });
      toc += '</ul></div>';
    });
    if (!list.length) content = '<p class="border border-dashed border-line p-8 text-center text-muted">条件に合うケースがありません。絞り込みを外してください。</p>';
    document.getElementById('toc').innerHTML = toc;
    document.getElementById('content').innerHTML = content;
    state.openAll = null;
  }

  function buildLegend() {
    var counts = countPerspectives();
    document.getElementById('legend-body').innerHTML = PERSPECTIVES.map(function (p) {
      return '<div class="legend-item"><div>' + perspectiveChipHtml(p.name) + '<div class="legend-count">' + (counts[p.name] || 0) + ' ケース</div></div>' +
        '<div>' + esc(p.condition) + '</div></div>';
    }).join('');
  }

  function countPerspectives() {
    var counts = {};
    CASES.forEach(function (c) { c.g.forEach(function (p) { counts[p] = (counts[p] || 0) + 1; }); });
    return counts;
  }

  function filterButtonHtml(attribute, value, colorVar, count) {
    return '<button type="button" ' + attribute + '="' + esc(value) + '"' + (colorVar ? ' style="--c:var(' + colorVar + ')"' : '') + ' aria-pressed="false" class="filter-btn">' +
      esc(value) + '<span class="count">' + count + '</span></button>';
  }

  function buildFilters() {
    buildLegend();
    var counts = {};
    CASES.forEach(function (c) { counts[c.t] = (counts[c.t] || 0) + 1; });
    var kf = document.getElementById('kind-filter');
    kf.innerHTML = KINDS.filter(function (k) { return counts[k]; }).map(function (k) {
      return filterButtonHtml('data-kind', k, '--k' + kindIndex(k), counts[k]);
    }).join('');
    kf.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var k = b.getAttribute('data-kind');
      if (state.kinds.has(k)) state.kinds.delete(k); else state.kinds.add(k);
      b.setAttribute('aria-pressed', state.kinds.has(k) ? 'true' : 'false');
      render();
    });
    var perspectiveCounts = countPerspectives();
    var untagged = CASES.filter(function (c) { return c.g.length === 0; }).length;
    var pf = document.getElementById('perspective-filter');
    pf.innerHTML = PERSPECTIVES.map(function (p, i) {
      return filterButtonHtml('data-perspective', p.name, '--t' + i, perspectiveCounts[p.name] || 0);
    }).join('') + filterButtonHtml('data-perspective', NO_PERSPECTIVE, '', untagged);
    pf.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var p = b.getAttribute('data-perspective');
      if (state.perspectives.has(p)) state.perspectives.delete(p); else state.perspectives.add(p);
      b.setAttribute('aria-pressed', state.perspectives.has(p) ? 'true' : 'false');
      render();
    });
    var nf = document.getElementById('na-filter');
    var opts = [['', 'すべて'], ['正常系', '正常系'], ['異常系', '異常系']];
    nf.innerHTML = opts.map(function (o) {
      return '<button type="button" data-na="' + o[0] + '" aria-pressed="' + (o[0] === '' ? 'true' : 'false') + '" class="na-btn px-3 py-1.5 text-muted hover:bg-sunken aria-pressed:bg-accent-soft aria-pressed:font-medium aria-pressed:text-fg">' + o[1] + '</button>';
    }).join('');
    nf.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.na = b.getAttribute('data-na');
      nf.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      render();
    });
    document.getElementById('content').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-section-action]'); if (!b) return;
      var isExpand = b.getAttribute('data-section-action') === 'expand';
      b.closest('section').querySelectorAll('details').forEach(function (d) { d.open = isExpand; });
    });
    document.getElementById('expand').addEventListener('click', function () { state.openAll = true; render(); });
    document.getElementById('collapse').addEventListener('click', function () { state.openAll = false; render(); });
  }

  buildFilters();
  render();
})();
</script>
</body>
</html>
